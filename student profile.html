<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body style="background: #f3f3ff; padding: 16px;
 font-family: Arial;
 color: #1f1f7a;">
    <main>
        <div style="background: linear-gradient(135deg, #4f46e5,#7c3aed);
        color: white; padding: 16px; box-shadow: 0 3px 12px;
         border-radius: 10px;
         text-align: center;">
            <h1 style="margin: 0;">Student Profile Page</h1>
        </div>
        <section style="background: white; padding: 5px;
         margin-top: 12px;
        border-radius: 20px; text-align: center; 
        box-shadow: 0 0px 20px blue; border-right: 42px solid #4f46e5;">
            <h2 style="background: whitesmoke; padding: 2px;
            box-shadow: 0 4px 41px #1f1f7a;
            border-right: 42px solid #4f46e5; 
            border-radius: 14px;">About Me</h2>
            <img style="border-radius: 50%; border: 3px solid #4f46e5; box-shadow: 0 0 30px blue;" src="https://randomuser.me/api/portraits/men/85.jpg" alt="Sorry for inconvenience" width="80" height="80">
            <p style="padding: 16px; 
            box-shadow: 0 0 30px blue; border-radius: 20px; text-shadow: 1px 1px 4px #4338ca; 
             border-right: 42px solid #4f46e5; border-left: 42px solid #4f46e5;">Manellore Geetha Madhur Reddy | CSE</p>
        </section>
        <section style="background: whitesmoke; padding: 4px; 
        margin-top: 20px; 
        border-left: 50px solid #4f46e5;
         border-right: 42px solid #4f46e5;
         border-radius: 20px; box-shadow: 0 0px 10px blue;">
            <h2 style="background: whitesmoke; padding: 2px;
            box-shadow: 0 4px 41px #1f1f7a;
            border-right: 42px solid #4f46e5; 
            border-radius: 14px;">My Skill</h2>
            <ul style="display: flex; flex-wrap: wrap;
            gap: 8px; list-style: none;
            padding: 0;">
                <li style="background: #ede9fe; color: #4338ca; padding: 15px 14px;
                border-radius: 30px;">HTML</li>
                <li style="background: #ede9fe; color: #4338ca; padding: 15px 14px;
                border-radius: 30px;">Python</li>
                <li style="background: #ede9fe; color: #4338ca; padding: 15px 14px;
                border-radius: 30px;">Java</li>
                <li style="background: #ede9fe; color: #4338ca; padding: 15px 14px;
                border-radius: 30px;">MySQL</li>
            </ul>
        </section>
        <section style="background: white; padding: 10px; margin-top: 15px;
         border-radius: 26px; border-left: 42px solid #4f46e5; 
         border-right: 42px solid #4f46e5; box-shadow: 0 0px 30px blue;">
            <h2 style="background: whitesmoke; padding: 2px;
            box-shadow: 0 4px 41px #1f1f7a;
            border-right: 42px solid #4f46e5; 
            border-radius: 14px;">My Projects</h2>
            <p>Registration Form • Library Page</p>
        </section>
        <section style="background: white; padding: 5px; margin-top: 14px;
  border-radius: 30px; box-shadow: 0 0px 30px blue;
  border-left: 42px solid #4f46e5; border-right: 42px solid #4f46e5;">
            <h2 style="background: whitesmoke; padding: 2px;
            box-shadow: 0 4px 41px #1f1f7a;
            border-right: 42px solid #4f46e5; 
            border-radius: 14px;">Course Registration</h2>
            <form action="" method="get">
                <label for="name">Full Name</label>
                <input style="box-sizing: border-box; width: 100%;
                padding: 5px; margin: 12px 4px 20px; background: #f8fafc;
                border: 20px solid #cbd5e1; border-radius: 16px;" required
                type="text" name="name" id="name" placeholder="Enter Full Name">
                
                <label for="email">Email</label>
                <input style="box-sizing: border-box; width: 100%;
                padding: 5px; margin: 12px 4px 20px; background: #f8fafc;
                border: 20px solid #cbd5e1; border-radius: 16px;"
                type="email" name="email" id="email" placeholder="Enter Email" required>       
                
                <label for="course">Course</label>
                <select style="box-sizing: border-box; width: 100%;
                padding: 5px; margin: 12px 4px 20px; background: #f8fafc;
                border: 20px solid #cbd5e1; border-radius: 16px;" 
                name="course" id="course">
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="html">HTML</option>
                </select>
                
                <div style="background: white; padding: 5px; margin-top: 14px;
                border-radius: 30px; box-shadow: 1px 14px 20px white; 
                border-left: 42px solid #4f46e5; border-right: 42px solid #4f46e5;">
                    <h2 style="margin: 1px 4px 20px; color: #0f172a; 
                    font-size: 15px;">Learning Mode:</h2>
                    <label style="box-sizing: border-box;
                    padding: 0px; margin: 0 10px 20px; background: #f8fafc;
                    border: 10px solid #3557c5; border-radius: 26px;"
                    for="online"><input type="radio" name="mode" id="online" 
                    value="online">Online</label> 

                    <label style="box-sizing: border-box;
                    padding: 0px; margin: 0 1px 2px; background: #f8fafc;
                    border: 10px solid #3557c5; border-radius: 26px;"
                    for="offline"><input type="radio" name="mode" id="offline" 
                    value="offline">Offline</label>
                </div>
                
                <label for="comment">Comments:</label>
                <textarea style="box-sizing: border-box; width: 100%; padding: 10px;
                margin: 12px 2px 20px; background-color: #bec4d7; 
                border: 1px solid #cbd5e1; border-radius: 10px;" required
                name="comment" id="comment" cols="30" rows="10"></textarea>
                
                <p>
                    <label for="agree"><input type="checkbox" name="agree" id="agree">I agree the terms and conditions</label>
                </p>
                <button style="background: #4f46e5; 
                color: white; padding: 10px 18px;
                border: 0; border-radius: 12px;" type="submit">Register</button>
                <button style="background: #4f46e5; 
                color: white; padding: 10px 18px;
                border: 0; border-radius: 12px;" type="reset">Reset</button>
            </form>
        </section>
    </main>
</body>
</html>
