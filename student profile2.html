<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - Manellore Geetha Madhur Reddy</title>
  <style>
    /* Global Page Setup */
    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #f3e8ff 100%);
      padding: 24px 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #1f1f7a;
      margin: 0;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
    }

    /* Animated Aurora Header */
    .hero-header {
      background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #9333ea);
      background-size: 300% 300%;
      animation: gradientFlow 8s ease infinite;
      color: white;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);
      border-radius: 16px;
      text-align: center;
      margin-bottom: 24px;
    }

    .hero-header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
    }

    /* Lively Card Sections (Preserving your signature indigo side-accents) */
    .profile-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 24px;
      margin-top: 22px;
      border-radius: 20px;
      border-left: 14px solid #4f46e5;
      border-right: 14px solid #4f46e5;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(79, 70, 229, 0.28);
    }

    .about-card {
      text-align: center;
    }

    /* Section Headings */
    h2 {
      background: #f8fafc;
      padding: 10px 18px;
      margin-top: 0;
      box-shadow: 0 4px 14px rgba(31, 31, 122, 0.12);
      border-right: 12px solid #4f46e5;
      border-radius: 12px;
      font-size: 1.25rem;
      text-align: left;
    }

    /* Floating Profile Photo */
    .avatar {
      border-radius: 50%;
      border: 4px solid #4f46e5;
      box-shadow: 0 0 25px rgba(79, 70, 229, 0.55);
      margin: 12px 0;
      animation: floatAvatar 4s ease-in-out infinite;
    }

    /* Animated Name Banner */
    .name-banner {
      padding: 16px 24px;
      background: linear-gradient(-45deg, #4f46e5, #7c3aed, #0ea5e9, #6366f1);
      background-size: 300% 300%;
      animation: gradientFlow 6s ease infinite;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
      border-radius: 16px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      border-left: 16px solid #312e81;
      border-right: 16px solid #312e81;
      margin-bottom: 0;
    }

    /* Interactive Skill Pills */
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      list-style: none;
      padding: 0;
      margin: 16px 0 4px;
    }

    .skills-list li {
      background: #ede9fe;
      color: #4338ca;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 30px;
      border: 2px solid transparent;
      cursor: default;
      transition: all 0.25s ease;
    }

    .skills-list li:hover {
      background: #4f46e5;
      color: #ffffff;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    /* Project Tags */
    .project-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .project-badge {
      background: #f1f5f9;
      border-left: 5px solid #4f46e5;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .project-badge:hover {
      background: #e0e7ff;
      transform: translateX(6px);
    }

    /* Form Controls */
    label {
      font-weight: 600;
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      color: #0f172a;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
    }

    /* Learning Mode Radio Pills */
    .mode-box {
      background: #f8fafc;
      padding: 16px;
      margin: 18px 0;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
    }

    .mode-title {
      margin: 0 0 12px;
      color: #0f172a;
      font-size: 1rem;
      font-weight: 700;
    }

    .radio-options {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .radio-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 10px 20px;
      background: #ffffff;
      border: 2px solid #4f46e5;
      border-radius: 26px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .radio-pill:hover {
      background: #eef2ff;
      transform: translateY(-2px);
    }

    .radio-pill input[type="radio"] {
      accent-color: #4f46e5;
      width: 16px;
      height: 16px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin: 12px 0 20px;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: #4f46e5;
      width: 18px;
      height: 18px;
    }

    /* Animated Shine Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      background: #4f46e5;
      color: white;
      padding: 12px 26px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #64748b;
    }

    .btn-secondary:hover {
      background: #475569;
      box-shadow: 0 8px 20px rgba(100, 116, 139, 0.35);
    }

    /* Keyframe Animations */
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero-header">
      <h1>Student Profile Page</h1>
    </header>

    <section class="profile-card about-card">
      <h2>About Me</h2>
      <img class="avatar" src="https://randomuser.me/api/portraits/men/85.jpg" alt="Profile Photo" width="96" height="96">
      <p class="name-banner">Manellore Geetha Madhur Reddy | CSE</p>
    </section>

    <section class="profile-card">
      <h2>My Skills</h2>
      <ul class="skills-list">
        <li>HTML</li>
        <li>Python</li>
        <li>Java</li>
        <li>MySQL</li>
      </ul>
    </section>

    <section class="profile-card">
      <h2>My Projects</h2>
      <div class="project-list">
        <div class="project-badge">Registration Form</div>
        <div class="project-badge">Library Page</div>
      </div>
    </section>

    <section class="profile-card">
      <h2>Course Registration</h2>
      <form action="" method="get">
        <label for="name">Full Name</label>
        <input required type="text" name="name" id="name" placeholder="Enter Full Name">

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter Email" required>

        <label for="course">Course</label>
        <select name="course" id="course">
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="html">HTML</option>
        </select>

        <div class="mode-box">
          <p class="mode-title">Learning Mode:</p>
          <div class="radio-options">
            <label class="radio-pill" for="online">
              <input type="radio" name="mode" id="online" value="online"> Online
            </label>
            <label class="radio-pill" for="offline">
              <input type="radio" name="mode" id="offline" value="offline"> Offline
            </label>
          </div>
        </div>

        <label for="comment">Comments:</label>
        <textarea required name="comment" id="comment" rows="5" placeholder="Write any questions or comments here..."></textarea>

        <label class="checkbox-label" for="agree">
          <input type="checkbox" name="agree" id="agree" required> I agree to the terms and conditions
        </label>

        <div class="btn-group">
          <button class="btn" type="submit">Register</button>
          <button class="btn btn-secondary" type="reset">Reset</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
